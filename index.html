<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allure Analytics — the pace of your pages</title>
  <meta name="description" content="Allure Analytics tells product and marketing teams where their site stands on speed against competitors, and which quick wins move them up.">
  <meta name="color-scheme" content="light dark">
  <!-- The card shown when the link is shared (LinkedIn, Slack, WhatsApp…). Absolute
       URLs: the live address on GitHub Pages. Image: tools/social-preview.html. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Allure Analytics">
  <meta property="og:title" content="Allure Analytics — your site’s speed against your competitors">
  <meta property="og:description" content="See where your site stands on speed against your competitors, and which quick wins move you up. Measured by Google, free, open source.">
  <meta property="og:url" content="https://everybodywantsmanu.github.io/allure-analytics/">
  <meta property="og:image" content="https://everybodywantsmanu.github.io/allure-analytics/assets/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="Allure Analytics: “You’re 3rd. Next step: 2nd place, 8 points away.”, a PageSpeed curve against competitors and the standings.">

  <link rel="icon" type="image/svg+xml" href="assets/allure-analytics-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter stands in for SF Pro on non-Apple systems. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = JSON.parse(localStorage.getItem('allure:theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="tooltip" class="tooltip" role="status" aria-live="polite" hidden></div>

</body>
